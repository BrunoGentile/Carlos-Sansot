<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sansot Viajes</title><link rel="stylesheet" href="src/css/styles.css"></head><body><header class="site-header"><img id="logo" alt="Logo" class="logo"><div><h1 id="agencyName">Sansot Viajes</h1><p id="tagline">Viajes actualizados desde Google Sheets</p></div><a id="whatsappLink" class="btn" href="#">WhatsApp</a></header><main><section class="hero"><h2>Encontrá tu próximo viaje</h2><p>Precios, fechas, cupos e imágenes se obtienen mediante Google Apps Script.</p></section><section id="trips" class="grid" aria-live="polite"></section><section id="booking" class="panel hidden"><h2>Reservar viaje</h2><form id="bookingForm"><input type="hidden" name="id_viaje"><label>Viaje<input name="viaje" readonly></label><label>Cantidad de pasajeros<input name="cantidad_pasajeros" type="number" min="1" value="1" required></label><label>Nombre<input name="nombre" required></label><label>Apellido<input name="apellido" required></label><label>Email<input name="email" type="email" required></label><label>Teléfono<input name="telefono" required></label><label>WhatsApp<input name="whatsapp"></label><label>Observaciones<textarea name="observaciones"></textarea></label><output id="bookingSummary"></output><button type="submit" class="btn">Enviar reserva</button></form></section></main><script type="module" src="src/js/main.js"></script></body></html>
